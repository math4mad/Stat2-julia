project:
  type: website
  output-dir: _site

website:
  title: "Stat2 Python Notes"
  description: "Rendered marimo notes migrated from Stat2 Julia examples."
  site-url: https://math4mad.github.io/Stat2-julia/
  repo-url: https://github.com/math4mad/Stat2-julia
  navbar:
    background: "#275f4b"
    foreground: "#fffdf7"
    left:
      - href: index.qmd
        text: Home
      - href: notes.qmd
        text: Notes
    right:
      - icon: github
        href: https://github.com/math4mad/Stat2-julia
  page-footer:
    left: "Stat2 Python migration"
    right: "Built with Quarto and marimo"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    code-fold: true
    link-external-newwindow: true
